name: Repository quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dataset.txt
            requirements-dev.txt

      - name: Install quality dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dataset.txt
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run foundation tests
        run: pytest

      - name: Lint repository workflows
        run: ruff check 01_CreateDataset 02_TrainModels 03_visuals tests

      - name: Type-check foundation tests
        run: mypy tests
